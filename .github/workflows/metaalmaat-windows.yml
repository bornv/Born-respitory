name: Materiaalprijs Converter Windows ZIP
on:
  push:
    branches: [metaalmaat-windows, claude/gallant-hawking-vo5yws]
    paths:
      - 'metaalmaat/**'
      - '.github/workflows/metaalmaat-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metaalmaat-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: metaalmaat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: metaalmaat/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify calculations, Excel export and file saving
        run: npm test
      - name: Generate supplier Excel template
        run: node scripts/build-template.mjs
      - name: Build Windows executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:windows -- --publish never
      - name: Smoke-test packaged Windows app
        env:
          CONVERTER_EXE: release/win-unpacked/Materiaalprijs Converter.exe
        run: npm run test:windows
      - name: Package distributable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/Materiaalprijs-Converter-Windows | Out-Null
          Copy-Item release/Materiaalprijs-Converter-2.0.1-Windows.exe release/Materiaalprijs-Converter-Windows/
          Copy-Item dist/Materiaalprijs-Converter-invulformat.xlsx release/Materiaalprijs-Converter-Windows/
          Copy-Item LEESMIJ-WINDOWS.txt release/Materiaalprijs-Converter-Windows/
          Copy-Item release/qa/smoke.json release/Materiaalprijs-Converter-Windows/WINDOWS-TEST.json
          "Versie: 2.0.1`nCommit: $env:GITHUB_SHA`nRun: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content release/Materiaalprijs-Converter-Windows/BUILD-INFO.txt
          Compress-Archive -Path release/Materiaalprijs-Converter-Windows -DestinationPath release/Materiaalprijs-Converter-Windows.zip -CompressionLevel Fastest -Force
          $zip = Get-Item release/Materiaalprijs-Converter-Windows.zip
          if ($zip.Length -lt 1000000) { throw 'ZIP ontbreekt of is onvolledig' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path release/Materiaalprijs-Converter-Windows.zip))
          try {
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()
              try { $stream.CopyTo([IO.Stream]::Null) } finally { $stream.Dispose() }
            }
            if (-not ($archive.Entries.FullName -match 'Materiaalprijs-Converter-2.0.1-Windows.exe')) { throw 'Exe ontbreekt in ZIP' }
          } finally { $archive.Dispose() }
          $hash = (Get-FileHash release/Materiaalprijs-Converter-Windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Materiaalprijs-Converter-Windows.zip" | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - name: Publish downloadable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release create jbt-marel-converter-v2.0.1 release/Materiaalprijs-Converter-Windows.zip release/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'JBT Marel Materiaalprijs Converter 2.0.1 — Windows' --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Publiceren van de nieuwe ZIP is mislukt; bestaande assets worden niet overschreven' }
