name: Metaalmaat Windows ZIP
on:
  push:
    branches: [metaalmaat-windows]
    paths:
      - 'metaalmaat/**'
      - '.github/workflows/metaalmaat-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metaalmaat-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: metaalmaat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: metaalmaat/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify calculations, Excel export and file saving
        run: npm test
      - name: Generate supplier Excel template
        run: node scripts/build-template.mjs
      - name: Build Windows executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:windows -- --publish never
      - name: Package distributable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/Metaalmaat-Windows | Out-Null
          Copy-Item release/Metaalmaat-2.0.0-Windows.exe release/Metaalmaat-Windows/
          Copy-Item dist/Metaalmaat-invulformat.xlsx release/Metaalmaat-Windows/
          Copy-Item LEESMIJ-WINDOWS.txt release/Metaalmaat-Windows/
          Compress-Archive -Path release/Metaalmaat-Windows -DestinationPath release/Metaalmaat-Windows.zip -CompressionLevel Fastest -Force
          $zip = Get-Item release/Metaalmaat-Windows.zip
          if ($zip.Length -lt 1000000) { throw 'ZIP ontbreekt of is onvolledig' }
          Get-FileHash release/Metaalmaat-Windows.zip -Algorithm SHA256 | Format-List
      - name: Publish downloadable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $tag = 'metaalmaat-v2.0.0'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag release/Metaalmaat-Windows.zip --clobber
          } else {
            gh release create $tag release/Metaalmaat-Windows.zip --target $env:GITHUB_SHA --title 'Metaalmaat Desktop 2.0 — Windows' --notes-file RELEASE-NOTES.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Publiceren van de ZIP is mislukt' }
