name: Materiaalprijs Converter Windows Setup
on:
  push:
    branches: [metaalmaat-windows, claude/gallant-hawking-vo5yws]
    paths:
      - 'metaalmaat/**'
      - '.github/workflows/metaalmaat-windows.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: metaalmaat-windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: metaalmaat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: metaalmaat/package-lock.json
      - name: Read version and stop if it is already published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Ongeldige versie in package.json: $version" }
          gh release view "jbt-marel-converter-v$version" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Versie $version is al gepubliceerd. Verhoog version in metaalmaat/package.json (en package-lock.json) voordat je deze wijziging pusht." }
          $global:LASTEXITCODE = 0
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Versie $version wordt gebouwd en gepubliceerd."
      - name: Install dependencies
        run: npm ci
      - name: Verify calculations, Excel export and file saving
        run: npm test
      - name: Generate supplier Excel template
        run: node scripts/build-template.mjs
      - name: Build Windows executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:windows -- --publish never
      - name: Test installation, installed app, reinstall and uninstall
        shell: pwsh
        run: ./scripts/test-setup.ps1 -SetupPath "release/Materiaalprijs-Converter-Setup-$env:VERSION-x64.exe"
      - name: Package distributable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/Materiaalprijs-Converter-Windows | Out-Null
          Copy-Item "release/Materiaalprijs-Converter-Setup-$env:VERSION-x64.exe" release/Materiaalprijs-Converter-Windows/
          Copy-Item dist/Materiaalprijs-Converter-invulformat.xlsx release/Materiaalprijs-Converter-Windows/
          Copy-Item LEESMIJ-WINDOWS.txt release/Materiaalprijs-Converter-Windows/
          Copy-Item release/qa/smoke.json release/Materiaalprijs-Converter-Windows/WINDOWS-TEST.json
          Copy-Item release/qa/setup-test.json release/Materiaalprijs-Converter-Windows/SETUP-TEST.json
          "Versie: $env:VERSION`nCommit: $env:GITHUB_SHA`nRun: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" | Set-Content release/Materiaalprijs-Converter-Windows/BUILD-INFO.txt
          Compress-Archive -Path release/Materiaalprijs-Converter-Windows -DestinationPath release/Materiaalprijs-Converter-Windows.zip -CompressionLevel Fastest -Force
          $zip = Get-Item release/Materiaalprijs-Converter-Windows.zip
          if ($zip.Length -lt 1000000) { throw 'ZIP ontbreekt of is onvolledig' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path release/Materiaalprijs-Converter-Windows.zip))
          try {
            foreach ($entry in $archive.Entries) {
              $stream = $entry.Open()
              try { $stream.CopyTo([IO.Stream]::Null) } finally { $stream.Dispose() }
            }
            if (-not ($archive.Entries.FullName -match [regex]::Escape("Materiaalprijs-Converter-Setup-$env:VERSION-x64.exe"))) { throw 'Exe ontbreekt in ZIP' }
          } finally { $archive.Dispose() }
          @('Materiaalprijs-Converter-Windows.zip', "Materiaalprijs-Converter-Setup-$env:VERSION-x64.exe") | ForEach-Object {
            $hash = (Get-FileHash (Join-Path release $_) -Algorithm SHA256).Hash.ToLower()
            "$hash  $_"
          } | Set-Content -Encoding ascii release/SHA256SUMS.txt
          Get-Content release/SHA256SUMS.txt
      - name: Publish downloadable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          gh release create "jbt-marel-converter-v$env:VERSION" "release/Materiaalprijs-Converter-Setup-$env:VERSION-x64.exe" release/Materiaalprijs-Converter-Windows.zip release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "JBT Marel Materiaalprijs Converter $env:VERSION — Windows Setup" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Publiceren van de nieuwe ZIP is mislukt; bestaande assets worden niet overschreven' }
