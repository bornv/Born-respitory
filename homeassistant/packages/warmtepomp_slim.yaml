# =============================================================================
# Slimme warmtepompregeling – Intergas Xtend via de kamerthermostaat
# =============================================================================
#
# Wat dit pakket doet
#   Het pakket verschuift het setpoint van je thermostaat een klein beetje rond
#   je basistemperatuur:
#     comfort        -> basistemperatuur
#     voorverwarmen  -> basis + kleine verhoging (goedkoop kwartier, er komt een
#                       dure periode aan en de Victron-batterij kan die niet dekken)
#     zon            -> basis + kleine verhoging (er is zonneoverschot)
#     besparen       -> basis - verlaging (duur kwartier en batterij leeg;
#                       standaard 0,0 °C, dus de basistemperatuur blijft gelden)
#   Wijzigingen gaan in kleine stappen met een minimale wachttijd, zodat de
#   warmtepomp rustig doorloopt en de cv-ketel niet bijspringt.
#
# Wat dit pakket NIET doet
#   - Het stuurt de batterij niet aan. Laden en ontladen blijft bij Victron
#     (ESS / Dynamic ESS). Het pakket leest alleen de SoC.
#   - Het praat niet rechtstreeks met de Xtend. De Xtend volgt de warmtevraag
#     van de thermostaat (OpenTherm).
#
# Gebruikte entiteiten (installatie Born, gecontroleerd 13-10-2026):
#   climate.thermostat_1                          -> kamerthermostaat (InComfort)
#   sensor.zonneplan_current_quarter_hourly_electricity_tariff -> Zonneplan ONE
#   sensor.ac_system_0_dc_battery_charge          -> Victron DC battery charge (%)
#   sensor.ac_system_0_grid_power_l1/l2/l3        -> Victron Grid power per fase (W),
#                                                    opgeteld in sensor.wp_netvermogen
#   sensor.ac_system_0_pv_power                   -> Victron PV power (W)
#   sensor.huisverbruik_totaal                    -> eigen somhelper Consumption power L1-L3 (W)
#   number.ac_system_0_ess_min_soc_limit          -> Victron ESS min SoC limit (%)
#   sensor.ac_system_0_dynamic_ess_minimum_soc    -> Victron Dynamic ESS minimum SoC (%)
#
# Installatie: zie homeassistant/README-warmtepomp.md
# =============================================================================

input_boolean:
  wp_slim_actief:
    name: "WP slimme regeling actief"
    icon: mdi:heat-pump
  wp_handmatig_wordt_basis:
    name: "WP handmatige wijziging wordt nieuwe basis"
    icon: mdi:hand-back-right

input_number:
  wp_basistemperatuur:
    name: "WP basistemperatuur"
    min: 15
    max: 23
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:home-thermometer
    mode: box
  wp_voorverwarm_verhoging:
    name: "WP verhoging bij voorverwarmen"
    min: 0
    max: 1.5
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-up
  wp_zon_verhoging:
    name: "WP verhoging bij zonneoverschot"
    min: 0
    max: 1.5
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:solar-power
  wp_besparen_verlaging:
    name: "WP verlaging bij dure stroom en lege batterij"
    min: 0
    max: 1
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:thermometer-chevron-down
  wp_max_stap:
    name: "WP maximale stap per wijziging"
    min: 0.1
    max: 1
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:stairs
  wp_thermostaat_stap:
    name: "WP stapgrootte thermostaat"
    min: 0.1
    max: 1
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:ruler
  wp_wachttijd:
    name: "WP minimale tijd tussen wijzigingen"
    min: 10
    max: 120
    step: 5
    unit_of_measurement: "min"
    icon: mdi:timer-sand
  wp_handmatig_duur:
    name: "WP pauze na handmatige wijziging"
    min: 0.5
    max: 12
    step: 0.5
    unit_of_measurement: "h"
    icon: mdi:hand-back-right
  wp_prijs_horizon:
    name: "WP prijsvenster vooruit"
    min: 4
    max: 24
    step: 1
    unit_of_measurement: "h"
    icon: mdi:chart-timeline-variant
  wp_voorverwarm_horizon:
    name: "WP vooruitkijken naar dure periode"
    min: 1
    max: 12
    step: 1
    unit_of_measurement: "h"
    icon: mdi:clock-fast
  wp_min_prijsverschil:
    name: "WP minimaal prijsverschil goedkoop/duur"
    min: 0
    max: 0.5
    step: 0.01
    unit_of_measurement: "€/kWh"
    icon: mdi:cash-minus
  wp_zon_drempel:
    name: "WP zonneoverschot aan vanaf"
    min: 200
    max: 5000
    step: 100
    unit_of_measurement: "W"
    icon: mdi:solar-power-variant
  wp_zon_uit_marge:
    name: "WP zonneoverschot uit bij tekort van"
    min: 0
    max: 2000
    step: 50
    unit_of_measurement: "W"
    icon: mdi:solar-power-variant-outline
  wp_batterij_capaciteit:
    name: "WP bruikbare batterijcapaciteit"
    min: 0
    max: 60
    step: 0.5
    unit_of_measurement: "kWh"
    icon: mdi:battery-high
  wp_batterij_min_soc:
    name: "WP minimale SoC (gelijk aan Victron ESS)"
    min: 0
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-low
  wp_verbruik_reserve:
    name: "WP verwacht verbruik als meting ontbreekt"
    min: 100
    max: 5000
    step: 50
    unit_of_measurement: "W"
    icon: mdi:home-lightning-bolt
  wp_verbruik_marge:
    name: "WP veiligheidsmarge verbruik dure uren"
    min: 1
    max: 2.5
    step: 0.05
    icon: mdi:shield-plus
  wp_batterij_rendement:
    name: "WP rendement batterij naar huis"
    min: 50
    max: 100
    step: 1
    unit_of_measurement: "%"
    icon: mdi:battery-sync
  # Intern: laatste setpoint dat deze regeling heeft gestuurd. Hiermee wordt
  # een handmatige wijziging herkend. Niet zelf aanpassen.
  wp_laatst_ingesteld:
    name: "WP laatst ingesteld setpoint (intern)"
    min: 5
    max: 30
    step: 0.1
    unit_of_measurement: "°C"
    icon: mdi:robot
    mode: box

input_datetime:
  wp_laatste_wijziging:
    name: "WP laatste setpointwijziging (intern)"
    has_date: true
    has_time: true
    icon: mdi:clock-outline

timer:
  wp_handmatig:
    name: "WP handmatige pauze"
    restore: true
    icon: mdi:hand-back-right

script:
  # Eenmalig uitvoeren na installatie (en wanneer je terug wilt naar de
  # aanbevolen instellingen). Nieuwe input_number-helpers starten anders op
  # hun minimum, bijvoorbeeld een basistemperatuur van 15 °C.
  wp_standaardwaarden_instellen:
    alias: "WP slim – standaardwaarden instellen"
    icon: mdi:restore
    mode: single
    sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.wp_slim_actief
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_basistemperatuur
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_laatst_ingesteld
        data:
          value: >
            {{ state_attr('climate.thermostat_1', 'temperature') | float(20) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_voorverwarm_verhoging
        data:
          value: 0.5
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_zon_verhoging
        data:
          value: 0.5
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_besparen_verlaging
        data:
          value: 0
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_max_stap
        data:
          value: 0.5
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_thermostaat_stap
        data:
          value: 0.5
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_wachttijd
        data:
          value: 30
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_handmatig_duur
        data:
          value: 3
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_prijs_horizon
        data:
          value: 12
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_voorverwarm_horizon
        data:
          value: 6
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_min_prijsverschil
        data:
          value: 0.06
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_zon_drempel
        data:
          value: 1000
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_zon_uit_marge
        data:
          value: 300
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_batterij_capaciteit
        data:
          # BYD: 312 Ah x 51,2 V = ca. 16 kWh (4 modules)
          value: 16
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_batterij_min_soc
        data:
          value: 20
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_verbruik_reserve
        data:
          value: 800
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_verbruik_marge
        data:
          value: 1.3
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_batterij_rendement
        data:
          value: 90

sensor:
  # Netvermogen = som van de drie fasen (W, + = afname, - = teruglevering).
  - platform: min_max
    name: "WP netvermogen"
    unique_id: wp_netvermogen
    type: sum
    round_digits: 0
    entity_ids:
      - sensor.ac_system_0_grid_power_l1
      - sensor.ac_system_0_grid_power_l2
      - sensor.ac_system_0_grid_power_l3

  # Tijdgewogen gemiddeld huisverbruik over 24 uur. Wordt gebruikt om te
  # schatten hoeveel energie de dure periode kost.
  - platform: statistics
    name: "WP gemiddeld huisverbruik"
    unique_id: wp_gemiddeld_huisverbruik
    entity_id: sensor.huisverbruik_totaal
    state_characteristic: average_linear
    max_age:
      hours: 24
    sampling_size: 20000
    precision: 0

template:
  # ---------------------------------------------------------------------------
  # Zonneoverschot met hysterese.
  # Aan:  PV - huisverbruik > drempel én er wordt echt teruggeleverd.
  #       (De terugleverings-check voorkomt dat 'zon' aangaat als Victron de
  #       batterij naar het net ontlaadt.)
  # Uit:  PV - huisverbruik zakt onder -marge, dus het extra stoken wordt
  #       duidelijk niet meer door de zon gedekt.
  # ---------------------------------------------------------------------------
  - binary_sensor:
      - name: "WP zonneoverschot"
        unique_id: wp_zonneoverschot
        icon: mdi:solar-power
        state: >
          {% set pv = states('sensor.ac_system_0_pv_power') | float(0) %}
          {% set verbruik = states('sensor.huisverbruik_totaal') | float(0) %}
          {% set net = states('sensor.wp_netvermogen') | float(0) %}
          {% set overschot = pv - verbruik %}
          {% if this.state == 'on' %}
            {{ overschot > -(states('input_number.wp_zon_uit_marge') | float(300)) }}
          {% else %}
            {{ overschot > states('input_number.wp_zon_drempel') | float(1000)
               and -net > states('input_number.wp_zon_drempel') | float(1000) / 2 }}
          {% endif %}
        delay_on: "00:10:00"
        delay_off: "00:15:00"
        availability: >
          {% set pv = states.sensor.ac_system_0_pv_power %}
          {{ pv is not none
             and (now() - pv.last_reported).total_seconds() < 900
             and has_value('sensor.ac_system_0_pv_power')
             and has_value('sensor.huisverbruik_totaal')
             and has_value('sensor.wp_netvermogen') }}

  # ---------------------------------------------------------------------------
  # Ketelbijstook. De InComfort-thermostaat meldt hvac_action 'heating' als de
  # cv-ketel brandt én pompt. Aan na 3 minuten branden; blijft daarna nog 2 uur
  # aan, zodat er in die tijd niet extra wordt voorverwarmd.
  # ---------------------------------------------------------------------------
  - binary_sensor:
      - name: "WP ketel springt bij"
        unique_id: wp_ketel_bijstook
        icon: mdi:fire-alert
        state: "{{ is_state_attr('climate.thermostat_1', 'hvac_action', 'heating') }}"
        delay_on: "00:03:00"
        delay_off: "02:00:00"

  # ---------------------------------------------------------------------------
  # Kern: bepaalt elke 5 minuten de gewenste regelmodus en de verschuiving.
  # Prijzen: Zonneplan-forecast, bedrag / 10.000.000 = €/kWh incl. btw.
  # ---------------------------------------------------------------------------
  - triggers:
      - trigger: time_pattern
        minutes: "/5"
        seconds: 15
      - trigger: state
        entity_id:
          - sensor.zonneplan_current_quarter_hourly_electricity_tariff
          - binary_sensor.wp_zonneoverschot
          - binary_sensor.wp_ketel_bijstook
          - input_number.wp_verbruik_marge
          - input_number.wp_batterij_rendement
          - input_number.wp_voorverwarm_verhoging
          - input_number.wp_zon_verhoging
          - input_number.wp_besparen_verlaging
          - input_number.wp_prijs_horizon
          - input_number.wp_voorverwarm_horizon
          - input_number.wp_min_prijsverschil
          - input_number.wp_batterij_capaciteit
          - input_number.wp_batterij_min_soc
          - number.ac_system_0_ess_min_soc_limit
          - sensor.ac_system_0_dynamic_ess_minimum_soc
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    variables:
      plan: >
        {% set fc = state_attr('sensor.zonneplan_current_quarter_hourly_electricity_tariff', 'forecast') %}
        {% set nu = now() %}
        {% set horizon = now() + timedelta(hours=states('input_number.wp_prijs_horizon') | float(12)) %}
        {% set vooruit = now() + timedelta(hours=states('input_number.wp_voorverwarm_horizon') | float(6)) %}
        {% set ns = namespace(venster=[], prijs_nu=none, duur_uren=[]) %}
        {% if fc is iterable and fc is not string %}
          {% for k in fc %}
            {% set start = as_datetime(k.start_date | string) %}
            {% set eind = as_datetime(k.end_date | string) if k.end_date is defined and k.end_date else none %}
            {% set eind = eind if eind else start + timedelta(minutes=15) %}
            {% set bedrag = k.price_tax_included.amount if k.price_tax_included is defined else none %}
            {% if start and bedrag is number %}
              {% set prijs = bedrag / 10000000 %}
              {% if start <= nu < eind %}
                {% set ns.prijs_nu = prijs %}
              {% endif %}
              {% if eind > nu and start < horizon %}
                {% set ns.venster = ns.venster + [prijs] %}
              {% endif %}
              {% if start > nu and start < vooruit %}
                {% set ns.duur_uren = ns.duur_uren + [[prijs, (eind - start).total_seconds() / 3600]] %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% set n = ns.venster | count %}
        {% if ns.prijs_nu is none or n < 8 %}
          {{ {'modus': 'comfort', 'reden': 'Te weinig prijsdata', 'prijs_nu': ns.prijs_nu,
              'laag': none, 'hoog': none, 'benodigd_kwh': 0, 'beschikbaar_kwh': none,
              'batterij_ok': none} }}
        {% else %}
          {% set gesorteerd = ns.venster | sort %}
          {% set laag = gesorteerd[(n * 0.25) | int] %}
          {% set hoog = gesorteerd[[(n * 0.75) | int, n - 1] | min] %}
          {% set verschil_ok = (hoog - laag) >= states('input_number.wp_min_prijsverschil') | float(0.06) %}
          {% set goedkoop = verschil_ok and ns.prijs_nu <= laag %}
          {% set duur = verschil_ok and ns.prijs_nu >= hoog %}
          {% set verbruik_w = states('sensor.wp_gemiddeld_huisverbruik') | float(states('input_number.wp_verbruik_reserve') | float(800)) %}
          {% set ns2 = namespace(uren=0) %}
          {% for p in ns.duur_uren if verschil_ok and p[0] >= hoog %}
            {% set ns2.uren = ns2.uren + p[1] %}
          {% endfor %}
          {% set marge = states('input_number.wp_verbruik_marge') | float(1.3) %}
          {% set rendement = [states('input_number.wp_batterij_rendement') | float(90), 50] | max / 100 %}
          {# Verbruik in dure uren = 24-uursgemiddelde x veiligheidsmarge (winteravond
             ligt hoger dan het gemiddelde), plus omzettingsverlies batterij -> huis. #}
          {% set benodigd = ns2.uren * verbruik_w * marge / 1000 / rendement %}
          {# Batterijgegevens zijn alleen bruikbaar als SoC én beide Victron-
             ondergrenzen een waarde hebben en de SoC in het afgelopen uur is gemeld.
             Anders rekent de regeling voorzichtig met 0 kWh beschikbaar. #}
          {% set soc_st = states.sensor.ac_system_0_dc_battery_charge %}
          {% set batterij_ok = soc_st is not none
               and has_value('sensor.ac_system_0_dc_battery_charge')
               and (now() - soc_st.last_reported).total_seconds() < 3600
               and has_value('number.ac_system_0_ess_min_soc_limit')
               and has_value('sensor.ac_system_0_dynamic_ess_minimum_soc') %}
          {% set soc = states('sensor.ac_system_0_dc_battery_charge') | float(0) %}
          {% set min_soc = [states('input_number.wp_batterij_min_soc') | float(20),
                            states('number.ac_system_0_ess_min_soc_limit') | float(100),
                            states('sensor.ac_system_0_dynamic_ess_minimum_soc') | float(100)] | max %}
          {% set cap = states('input_number.wp_batterij_capaciteit') | float(0) %}
          {% set beschikbaar = (([soc - min_soc, 0] | max) / 100 * cap) if batterij_ok else 0 %}
          {% set ketel = is_state('binary_sensor.wp_ketel_bijstook', 'on') %}
          {% set batterij_dekt_straks = beschikbaar >= benodigd %}
          {% set batterij_dekt_nu = beschikbaar >= verbruik_w / 1000 * 0.5 %}
          {% if ketel and (is_state('binary_sensor.wp_zonneoverschot', 'on') or ns.prijs_nu <= 0
                           or (goedkoop and benodigd > 0 and not batterij_dekt_straks)) %}
            {% set modus, reden = 'comfort', 'Ketel sprong bij: 2 uur geen extra verwarmen' %}
          {% elif is_state('binary_sensor.wp_zonneoverschot', 'on') %}
            {% set modus, reden = 'zon', 'Zonneoverschot' %}
          {% elif ns.prijs_nu <= 0 %}
            {% set modus, reden = 'voorverwarmen', 'Negatieve of nul stroomprijs' %}
          {% elif goedkoop and benodigd > 0 and not batterij_dekt_straks %}
            {% set modus, reden = 'voorverwarmen', 'Goedkoop nu, dure periode komt en batterij dekt die niet' %}
          {% elif duur and not batterij_dekt_nu %}
            {% set modus, reden = 'besparen', 'Dure stroom en batterij (bijna) leeg' %}
          {% elif goedkoop and benodigd > 0 %}
            {% set modus, reden = 'comfort', 'Goedkoop, maar batterij dekt de dure periode' %}
          {% elif duur %}
            {% set modus, reden = 'comfort', 'Duur, batterij levert' %}
          {% else %}
            {% set modus, reden = 'comfort', 'Normale prijs' %}
          {% endif %}
          {{ {'modus': modus, 'reden': reden, 'prijs_nu': ns.prijs_nu | round(4),
              'laag': laag | round(4), 'hoog': hoog | round(4),
              'benodigd_kwh': benodigd | round(2), 'beschikbaar_kwh': beschikbaar | round(2),
              'batterij_ok': batterij_ok} }}
        {% endif %}
    sensor:
      - name: "WP regelmodus"
        unique_id: wp_regelmodus
        icon: mdi:heat-pump-outline
        state: "{{ plan.modus }}"
        attributes:
          verschuiving: >
            {% if plan.modus in ['voorverwarmen'] %}
              {{ states('input_number.wp_voorverwarm_verhoging') | float(0) }}
            {% elif plan.modus == 'zon' %}
              {{ states('input_number.wp_zon_verhoging') | float(0) }}
            {% elif plan.modus == 'besparen' %}
              {{ 0 - states('input_number.wp_besparen_verlaging') | float(0) }}
            {% else %}
              0
            {% endif %}
          reden: "{{ plan.reden }}"
          prijs_nu: "{{ plan.prijs_nu }}"
          grens_goedkoop: "{{ plan.laag }}"
          grens_duur: "{{ plan.hoog }}"
          benodigd_dure_periode_kwh: "{{ plan.benodigd_kwh }}"
          batterij_beschikbaar_kwh: "{{ plan.beschikbaar_kwh }}"
          batterijgegevens_betrouwbaar: "{{ plan.batterij_ok }}"

automation:
  # ---------------------------------------------------------------------------
  # Stuurt het thermostaat-setpoint naar basis + verschuiving, in kleine
  # stappen en met een minimale wachttijd tussen wijzigingen.
  # ---------------------------------------------------------------------------
  - id: wp_slim_setpoint_toepassen
    alias: "WP slim – setpoint toepassen"
    description: >
      Zet de thermostaat op basistemperatuur + verschuiving uit 'WP regelmodus'.
      Stapt rustig (max. stap per keer, minimale wachttijd) en doet niets tijdens
      een handmatige pauze.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: sensor.wp_regelmodus
        attribute: verschuiving
        id: regeling
      - trigger: time_pattern
        minutes: "/5"
        id: regeling
      - trigger: state
        entity_id: input_number.wp_basistemperatuur
        id: direct
      - trigger: timer.finished
        target:
          entity_id: timer.wp_handmatig
        id: direct
      - trigger: state
        entity_id: input_boolean.wp_slim_actief
        to: "on"
        id: direct
      - trigger: homeassistant
        event: start
        id: regeling
    conditions:
      - condition: state
        entity_id: input_boolean.wp_slim_actief
        state: "on"
      - condition: state
        entity_id: timer.wp_handmatig
        state: idle
      - condition: not
        conditions:
          - condition: state
            entity_id: climate.thermostat_1
            state:
              - "off"
              - unavailable
              - unknown
      - condition: template
        value_template: "{{ state_attr('climate.thermostat_1', 'temperature') is number }}"
    variables:
      thermostaat: climate.thermostat_1
      stap_thermostaat: "{{ [states('input_number.wp_thermostaat_stap') | float(0.5), 0.1] | max }}"
      max_stap: "{{ states('input_number.wp_max_stap') | float(0.5) }}"
      tmin: "{{ state_attr('climate.thermostat_1', 'min_temp') | float(5) }}"
      tmax: "{{ state_attr('climate.thermostat_1', 'max_temp') | float(30) }}"
      doel: >
        {% set basis = states('input_number.wp_basistemperatuur') | float(20) %}
        {% set versch = state_attr('sensor.wp_regelmodus', 'verschuiving') | float(0) %}
        {% set d = ((basis + versch) / stap_thermostaat) | round(0) * stap_thermostaat %}
        {{ ([[d, tmin] | max, tmax] | min) | round(1) }}
      huidig: "{{ state_attr('climate.thermostat_1', 'temperature') | float }}"
      nieuw: >
        {# Ver van het doel (> 2 °C, bijv. na een vreemd setpoint van buitenaf):
           direct naar het doel. Kleine verschillen gaan rustig in stappen. #}
        {% if (doel - huidig) | abs > 2 %}
          {{ doel }}
        {% else %}
          {# Naar beneden afronden op hele thermostaatstappen, zodat de stap nooit
             groter is dan 'WP maximale stap'. Is die kleiner dan één thermostaat-
             stap, dan is één thermostaatstap het minimum. Nooit voorbij het doel. #}
          {% set richting = 1 if doel > huidig else -1 %}
          {% set ruimte = [(doel - huidig) | abs, max_stap] | min %}
          {% set k = [((ruimte + 0.001) / stap_thermostaat) | round(0, 'floor'), 1] | max %}
          {% set n = huidig + richting * k * stap_thermostaat %}
          {% set n = doel if richting * (n - doel) > 0 else n %}
          {{ n | round(1) }}
        {% endif %}
      wachttijd_voorbij: >
        {% set ts = state_attr('input_datetime.wp_laatste_wijziging', 'timestamp') %}
        {{ ts is none or (now().timestamp() - ts) >= states('input_number.wp_wachttijd') | float(30) * 60 }}
    actions:
      - condition: template
        value_template: "{{ (doel - huidig) | abs >= 0.05 }}"
      - condition: template
        value_template: "{{ trigger.id == 'direct' or wachttijd_voorbij }}"
      # Eerst vastleggen wat we sturen, zodat de herkenning van handmatige
      # wijzigingen onze eigen wijziging negeert.
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_laatst_ingesteld
        data:
          value: "{{ nieuw }}"
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.wp_laatste_wijziging
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: climate.set_temperature
        target:
          entity_id: climate.thermostat_1
        data:
          temperature: "{{ nieuw }}"
      # Controleren of de gateway het nieuwe setpoint terugmeldt.
      - wait_template: >
          {{ (state_attr('climate.thermostat_1', 'temperature') | float(-99) - nieuw | float) | abs < 0.05 }}
        timeout: "00:02:00"
        continue_on_timeout: true
      - if:
          - condition: template
            value_template: "{{ not wait.completed }}"
        then:
          # Niet bevestigd: wachttijd vrijgeven zodat de volgende ronde (binnen
          # 5 minuten) het opnieuw probeert, en een melding geven.
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.wp_laatste_wijziging
            data:
              timestamp: 0
          - action: persistent_notification.create
            data:
              notification_id: wp_slim_geen_bevestiging
              title: "Warmtepomp: thermostaat bevestigt setpoint niet"
              message: >
                De regeling stuurde {{ nieuw }} °C naar climate.thermostat_1
                ({{ now().strftime('%H:%M') }}), maar de thermostaat meldt
                {{ state_attr('climate.thermostat_1', 'temperature') }} °C.
                Controleer de InComfort-gateway. De regeling probeert het
                binnen 5 minuten opnieuw.
        else:
          - action: persistent_notification.dismiss
            data:
              notification_id: wp_slim_geen_bevestiging

  # ---------------------------------------------------------------------------
  # Uitschakelen: staat de thermostaat nog op een setpoint van deze regeling
  # (dus niet handmatig gewijzigd), dan terug naar de basistemperatuur.
  # ---------------------------------------------------------------------------
  - id: wp_slim_uitschakelen_herstel
    alias: "WP slim – bij uitschakelen terug naar basis"
    description: >
      Als de regeling wordt uitgezet terwijl het setpoint nog een verhoging of
      verlaging van de regeling bevat, zet deze automatisering de thermostaat
      terug op de basistemperatuur. Een handmatige stand blijft ongemoeid.
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.wp_slim_actief
        from: "on"
        to: "off"
    conditions:
      - condition: state
        entity_id: timer.wp_handmatig
        state: idle
      - condition: template
        value_template: >
          {% set huidig = state_attr('climate.thermostat_1', 'temperature') %}
          {% set basis = states('input_number.wp_basistemperatuur') | float(0) %}
          {{ huidig is number and basis >= 15
             and (huidig - states('input_number.wp_laatst_ingesteld') | float(0)) | abs < 0.05
             and (huidig - basis) | abs >= 0.05 }}
    actions:
      - variables:
          basis: >
            {% set stap = [states('input_number.wp_thermostaat_stap') | float(0.5), 0.1] | max %}
            {{ ((states('input_number.wp_basistemperatuur') | float(20) / stap) | round(0) * stap) | round(1) }}
      - action: input_number.set_value
        target:
          entity_id: input_number.wp_laatst_ingesteld
        data:
          value: "{{ basis }}"
      - action: climate.set_temperature
        target:
          entity_id: climate.thermostat_1
        data:
          temperature: "{{ basis }}"

  # ---------------------------------------------------------------------------
  # Herkent een wijziging aan de thermostaat die niet van deze regeling komt
  # (aan de thermostaat zelf, in de app of in het HA-dashboard).
  # ---------------------------------------------------------------------------
  - id: wp_slim_handmatige_wijziging
    alias: "WP slim – handmatige wijziging herkennen"
    description: >
      Als het setpoint afwijkt van wat de regeling het laatst stuurde, is het
      handmatig gewijzigd. Dan pauzeert de regeling (timer) of wordt de nieuwe
      waarde de basistemperatuur, afhankelijk van de schakelaar.
    mode: restart
    triggers:
      - trigger: state
        entity_id: climate.thermostat_1
        attribute: temperature
    conditions:
      - condition: state
        entity_id: input_boolean.wp_slim_actief
        state: "on"
      - condition: template
        value_template: >
          {% set nieuw = trigger.to_state.attributes.temperature
                         if trigger.to_state is not none else none %}
          {% set oud = trigger.from_state.attributes.temperature
                       if trigger.from_state is not none else none %}
          {{ nieuw is number and oud is number
             and (nieuw - states('input_number.wp_laatst_ingesteld') | float(0)) | abs
                 > [states('input_number.wp_thermostaat_stap') | float(0.5) / 2, 0.15] | max }}
    actions:
      - variables:
          nieuw: "{{ trigger.to_state.attributes.temperature }}"
      # Beveiliging: een setpoint onder 15 °C (bijv. 5 °C van een oude
      # automatisering of vorstbeveiliging) is geen comfortkeuze. Niet pauzeren,
      # maar de regeling binnen 5 minuten laten herstellen en een melding geven.
      - if:
          - condition: template
            value_template: "{{ nieuw | float(0) < 15 }}"
        then:
          - action: timer.cancel
            target:
              entity_id: timer.wp_handmatig
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.wp_laatste_wijziging
            data:
              timestamp: 0
          - action: persistent_notification.create
            data:
              notification_id: wp_slim_laag_setpoint
              title: "Warmtepomp: setpoint {{ nieuw }} °C van buitenaf"
              message: >
                Iets anders dan de slimme regeling zette climate.thermostat_1 op
                {{ nieuw }} °C ({{ now().strftime('%H:%M') }}). De regeling zet hem
                terug naar de basistemperatuur. Zoek in het logboek van de
                thermostaat welke automatisering dit deed en zet die uit.
          - stop: "Setpoint onder 15 °C hersteld"
      - if:
          - condition: state
            entity_id: input_boolean.wp_handmatig_wordt_basis
            state: "on"
        then:
          # De handmatige waarde wordt de nieuwe basistemperatuur. De regeling
          # gaat daarna gewoon verder vanaf die basis.
          - action: input_number.set_value
            target:
              entity_id: input_number.wp_laatst_ingesteld
            data:
              value: "{{ nieuw }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.wp_basistemperatuur
            data:
              value: "{{ [[nieuw, 15] | max, 23] | min }}"
        else:
          # Tijdelijke handmatige stand: regeling pauzeert en neemt daarna
          # rustig weer over.
          - action: timer.start
            target:
              entity_id: timer.wp_handmatig
            data:
              duration: "{{ (states('input_number.wp_handmatig_duur') | float(3) * 3600) | int }}"
